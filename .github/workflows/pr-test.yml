name: PR Test

on:
  pull_request:
    branches: [0.28.0-dev]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  build:
    runs-on: hygon-build
    timeout-minutes: 90
    container:
      image: 10.16.1.152:5000/hcu/base/dtk:26.10-rockylinux8.6-py3.12@sha256:b888f86873c4eb9f05df99890f44f40a4f0e586a70fc2a009159684bc7352d92
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          persist-credentials: false
          fetch-depth: 0
      - name: Prepare HCU environment
        shell: bash
        run: |
          d="/ci_public/${GITHUB_REPOSITORY#*/}/runs/${GITHUB_RUN_ID}"
          mkdir -p "${d}"
          rm -f "${d}/build-requirements.txt" "${d}/aicc-version.txt"
          bash .github/scripts/setup-hcu-env.sh "${d}"
      - name: Build manylinux wheel
        shell: bash
        run: bash build_hcu_wheel.sh
      - name: Share wheel
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          wheels=(dist/manylinux/torchvision-*.whl)
          (( ${#wheels[@]} == 1 )) || { echo 'Expected one manylinux wheel' >&2; exit 1; }
          d="/ci_public/${GITHUB_REPOSITORY#*/}/runs/${GITHUB_RUN_ID}"
          mkdir -p "${d}"
          cp "${wheels[0]}" "${d}/"
          python3 -m pip freeze | grep -vi '^torchvision==' > "${d}/build-requirements.txt"

  test:
    needs: build
    runs-on: hygon-bw1100-1card
    timeout-minutes: 180
    container:
      image: 10.16.1.152:5000/hcu/base/dtk:26.10-rockylinux8.6-py3.12@sha256:b888f86873c4eb9f05df99890f44f40a4f0e586a70fc2a009159684bc7352d92
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          persist-credentials: false
      - name: Prepare HCU environment
        shell: bash
        run: |
          d="/ci_public/${GITHUB_REPOSITORY#*/}/runs/${GITHUB_RUN_ID}"
          [[ -s "${d}/build-requirements.txt" && -s "${d}/aicc-version.txt" ]] || exit 1
          bash .github/scripts/setup-hcu-env.sh "${d}"
      - name: Fetch wheel
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          wheels=(/ci_public/${GITHUB_REPOSITORY#*/}/runs/${GITHUB_RUN_ID}/torchvision-*.whl)
          (( ${#wheels[@]} == 1 )) || { echo 'Expected one shared wheel' >&2; exit 1; }
          mkdir -p dist/manylinux
          cp "${wheels[0]}" dist/manylinux/
      - name: Test wheel
        continue-on-error: true
        shell: bash
        run: bash .github/scripts/test-hcu-wheel.sh
      - name: Save test report
        if: ${{ always() }}
        shell: bash
        run: |
          d="/ci_public/${GITHUB_REPOSITORY#*/}/runs/${GITHUB_RUN_ID}"
          if [[ -f test-results.xml ]]; then cp test-results.xml "${d}/test-results.xml"; fi
