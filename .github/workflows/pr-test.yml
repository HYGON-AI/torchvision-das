name: pr-test

# This workflow intentionally executes fork PR code on a privileged self-hosted
# runner after repository maintainers approve the run. It must not consume
# repository secrets.
on:
  pull_request:
    branches:
      - 0.27.0-dev
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: torchvision-pr-test-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  DTK_PKG_URL: ${{ vars.RESOURCE_SERVER_URL }}/dtk-pkg/dtk26.04/DTK-26.04-rc4-centos8-x86_64.tar.gz
  PYPI_URL: ${{ vars.PYPI_URL }}
  INTERNAL_PIP_INDEX_URL: ${{ vars.PYPI_URL }}/das_nightly/dtk2604-rc4/+simple/

jobs:
  build-test:
    name: build-test (${{ matrix.python_version }})
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: self-hosted
    timeout-minutes: 480
    strategy:
      fail-fast: false
      matrix:
        include:
          - python_version: "3.10"
            image: ${{ vars.BASE_COMPILE_IMAGE_ROCKY_PY310 }}
          - python_version: "3.12"
            image: ${{ vars.BASE_COMPILE_IMAGE_ROCKY_PY312 }}
    container:
      image: ${{ matrix.image }}
      options: >-
        --device=/dev/kfd --device=/dev/dri/ --group-add video
        -v /opt/hyhal/:/opt/hyhal/:ro
        --shm-size=80G
        --cap-add=SYS_PTRACE
        --security-opt seccomp=unconfined
        --privileged=true

    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Integrate target branch
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"
          git -c user.name='TorchVision CI' -c user.email='ci@localhost' \
              merge --no-edit "${{ github.event.pull_request.base.sha }}"

      - name: Show CI environment flags
        shell: bash
        run: |
          echo "GITHUB_ACTIONS=${GITHUB_ACTIONS:-<unset>}"
          echo "CIRCLECI=${CIRCLECI:-<unset>}"
          echo "CI=${CI:-<unset>}"

      - name: Configure internal pip source
        shell: bash
        env:
          PIP_INDEX: ${{ env.INTERNAL_PIP_INDEX_URL }}
        run: |
          set -euo pipefail
          trusted_host="${PIP_INDEX#*://}"
          trusted_host="${trusted_host%%/*}"
          mkdir -p ~/.pip
          printf '%s\n' \
            '[global]' \
            "index-url = ${PIP_INDEX}" \
            "trusted-host = ${trusted_host}" \
            > ~/.pip/pip.conf

      - name: Install DTK
        shell: bash
        run: |
          set -euo pipefail
          cd /opt
          wget -q "${DTK_PKG_URL}"
          tar -xzf "$(basename "${DTK_PKG_URL}")"
          rm -rf dtk
          mv dtk-* dtk

      - name: Install AICC
        shell: bash
        env:
          RESOURCE_SERVER_URL: ${{ vars.RESOURCE_SERVER_URL }}
        run: |
          set -euo pipefail
          wget -q "${RESOURCE_SERVER_URL}/ai_cc/Nightly/hcu_llvm_installer.sh"
          bash hcu_llvm_installer.sh --major 1.0.0

      - name: Build and test torchvision
        shell: bash
        env:
          EXPECTED_PYTHON_VERSION: ${{ matrix.python_version }}
        run: bash vision027.sh

      - name: Clean workspace
        if: always()
        shell: bash
        run: rm -rf "${GITHUB_WORKSPACE}"/* "${GITHUB_WORKSPACE}"/.[!.]* || true
