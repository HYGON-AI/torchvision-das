name: PR Test

on:
  pull_request_target:
    branches: [0.28.0-dev]
    types: [opened, synchronize, reopened, ready_for_review, labeled]

permissions:
  contents: read

concurrency:
  group: pr-test-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  authorize:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      ready: ${{ steps.check.outputs.ready }}
      base_sha: ${{ steps.check.outputs.base_sha }}
      head_sha: ${{ steps.check.outputs.head_sha }}
    steps:
      - name: Pin PR commits and authorize HCU use
        id: check
        uses: actions/github-script@v7
        with:
          script: |
            const eventPr = context.payload.pull_request;
            const { data: pr } = await github.rest.pulls.get({
              ...context.repo,
              pull_number: eventPr.number,
            });
            if (pr.state !== 'open' || pr.base.ref !== '0.28.0-dev' ||
                pr.base.sha !== eventPr.base.sha || pr.head.sha !== eventPr.head.sha) {
              core.notice('PR commits changed; wait for a fresh event.');
              return;
            }
            const sameRepo = pr.head.repo?.full_name === context.payload.repository.full_name;
            const approvedFork = context.payload.action === 'labeled' &&
              context.payload.label?.name === 'hcu-ci-approved';
            if (!sameRepo && !approvedFork) {
              core.notice('A maintainer must apply hcu-ci-approved to run fork code on HCU.');
              return;
            }
            core.setOutput('base_sha', pr.base.sha);
            core.setOutput('head_sha', pr.head.sha);
            core.setOutput('ready', 'true');

  build:
    needs: authorize
    if: needs.authorize.outputs.ready == 'true'
    runs-on: hygon-build
    timeout-minutes: 90
    container:
      image: 10.16.1.152:5000/hcu/base/dtk:26.10-rockylinux8.6-py3.12@sha256:b888f86873c4eb9f05df99890f44f40a4f0e586a70fc2a009159684bc7352d92
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.authorize.outputs.base_sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Merge pinned PR commit
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ needs.authorize.outputs.head_sha }}
        run: |
          set -euo pipefail
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"
          git fetch --no-tags origin "+refs/pull/${PR_NUMBER}/head:refs/remotes/origin/ci-pr-head"
          test "$(git rev-parse refs/remotes/origin/ci-pr-head)" = "${PR_HEAD_SHA}"
          git -c user.name='torchvision CI' -c user.email='ci@users.noreply.github.com' \
            merge --no-ff --no-edit "${PR_HEAD_SHA}"
      - name: Prepare HCU environment
        shell: bash
        run: |
          d="/ci_public/${GITHUB_REPOSITORY#*/}/runs/${GITHUB_RUN_ID}"
          mkdir -p "${d}"
          rm -f "${d}/build-requirements.txt" "${d}/aicc-version.txt"
          bash .github/scripts/setup-hcu-env.sh "${d}"
      - name: Build manylinux wheel
        shell: bash
        run: bash build_hcu_wheel.sh
      - name: Share wheel
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          wheels=(dist/manylinux/torchvision-*.whl)
          (( ${#wheels[@]} == 1 )) || { echo 'Expected one manylinux wheel' >&2; exit 1; }
          d="/ci_public/${GITHUB_REPOSITORY#*/}/runs/${GITHUB_RUN_ID}"
          mkdir -p "${d}"
          cp "${wheels[0]}" "${d}/"
          python3 -m pip freeze | grep -vi '^torchvision==' > "${d}/build-requirements.txt"

  test:
    needs: [authorize, build]
    runs-on: hygon-bw1100-1card
    timeout-minutes: 180
    container:
      image: 10.16.1.152:5000/hcu/base/dtk:26.10-rockylinux8.6-py3.12@sha256:b888f86873c4eb9f05df99890f44f40a4f0e586a70fc2a009159684bc7352d92
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.authorize.outputs.base_sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Merge pinned PR commit
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ needs.authorize.outputs.head_sha }}
        run: |
          set -euo pipefail
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"
          git fetch --no-tags origin "+refs/pull/${PR_NUMBER}/head:refs/remotes/origin/ci-pr-head"
          test "$(git rev-parse refs/remotes/origin/ci-pr-head)" = "${PR_HEAD_SHA}"
          git -c user.name='torchvision CI' -c user.email='ci@users.noreply.github.com' \
            merge --no-ff --no-edit "${PR_HEAD_SHA}"
      - name: Prepare HCU environment
        shell: bash
        run: |
          d="/ci_public/${GITHUB_REPOSITORY#*/}/runs/${GITHUB_RUN_ID}"
          [[ -s "${d}/build-requirements.txt" && -s "${d}/aicc-version.txt" ]] || exit 1
          bash .github/scripts/setup-hcu-env.sh "${d}"
      - name: Fetch wheel
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          wheels=(/ci_public/${GITHUB_REPOSITORY#*/}/runs/${GITHUB_RUN_ID}/torchvision-*.whl)
          (( ${#wheels[@]} == 1 )) || { echo 'Expected one shared wheel' >&2; exit 1; }
          mkdir -p dist/manylinux
          cp "${wheels[0]}" dist/manylinux/
      - name: Test wheel
        shell: bash
        run: bash .github/scripts/test-hcu-wheel.sh
      - name: Save test report
        if: ${{ always() }}
        shell: bash
        run: |
          d="/ci_public/${GITHUB_REPOSITORY#*/}/runs/${GITHUB_RUN_ID}"
          if [[ -f test-results.xml ]]; then cp test-results.xml "${d}/test-results.xml"; fi
